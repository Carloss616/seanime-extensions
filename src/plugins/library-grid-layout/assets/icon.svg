<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#6d28d9"/>

  <!-- Row 1: three library cards (top margin 103, column gap 38) -->
  <g>
    <g transform="translate(62 103)">
      <rect width="104" height="212" rx="16" fill="#ffffff"/>
      <rect x="18" y="150" width="68" height="13" rx="6" fill="#6d28d9"/>
      <rect x="18" y="173" width="42" height="13" rx="6" fill="#6d28d9"/>
    </g>
    <g transform="translate(204 103)">
      <rect width="104" height="212" rx="16" fill="#ffffff"/>
      <rect x="18" y="150" width="68" height="13" rx="6" fill="#6d28d9"/>
      <rect x="18" y="173" width="42" height="13" rx="6" fill="#6d28d9"/>
    </g>
    <g transform="translate(346 103)">
      <rect width="104" height="212" rx="16" fill="#ffffff"/>
      <rect x="18" y="150" width="68" height="13" rx="6" fill="#6d28d9"/>
      <rect x="18" y="173" width="42" height="13" rx="6" fill="#6d28d9"/>
    </g>
  </g>

  <!-- Row 2: Material 3 Expressive slider.
       Row gap = column gap = 38 (cards bottom 315 -> handle top 353).
       Center y = 381. -->
  <g>
    <!-- inactive track (right of handle) -->
    <rect x="254" y="372" width="194" height="18" rx="9" fill="#ffffff" fill-opacity="0.35"/>
    <!-- active track (left of handle) -->
    <rect x="64" y="372" width="156" height="18" rx="9" fill="#ffffff"/>
    <!-- step tick marks (kept clear of the rounded track ends and the handle) -->
    <g fill="#6d28d9">
      <circle cx="87" cy="381" r="3.5"/>
      <circle cx="117" cy="381" r="3.5"/>
      <circle cx="147" cy="381" r="3.5"/>
      <circle cx="177" cy="381" r="3.5"/>
      <circle cx="207" cy="381" r="3.5"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.9">
      <circle cx="267" cy="381" r="3.5"/>
      <circle cx="297" cy="381" r="3.5"/>
      <circle cx="327" cy="381" r="3.5"/>
      <circle cx="357" cy="381" r="3.5"/>
      <circle cx="387" cy="381" r="3.5"/>
      <circle cx="417" cy="381" r="3.5"/>
    </g>
    <!-- handle: vertical pill, taller than the track, with a gap on each side -->
    <rect x="229" y="353" width="16" height="56" rx="8" fill="#ffffff"/>
  </g>
</svg>
