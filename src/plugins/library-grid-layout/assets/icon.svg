<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#6d28d9"/>

  <!-- Row 1: three library cards (top margin 103, column gap 38) -->
  <g>
    <g transform="translate(62 103)">
      <rect width="104" height="212" rx="16" fill="#ffffff"/>
      <rect x="18" y="150" width="68" height="13" rx="6" fill="#6d28d9"/>
      <rect x="18" y="173" width="42" height="13" rx="6" fill="#6d28d9"/>
    </g>
    <g transform="translate(204 103)">
      <rect width="104" height="212" rx="16" fill="#ffffff"/>
      <rect x="18" y="150" width="68" height="13" rx="6" fill="#6d28d9"/>
      <rect x="18" y="173" width="42" height="13" rx="6" fill="#6d28d9"/>
    </g>
    <g transform="translate(346 103)">
      <rect width="104" height="212" rx="16" fill="#ffffff"/>
      <rect x="18" y="150" width="68" height="13" rx="6" fill="#6d28d9"/>
      <rect x="18" y="173" width="42" height="13" rx="6" fill="#6d28d9"/>
    </g>
  </g>

  <!-- Row 2: Material 3 Expressive slider.
       Row gap = column gap = 38 (cards bottom 315 -> handle top 353).
       Track spans x=64..448; handle centered at x=256. Center y = 381. -->
  <g>
    <!-- inactive track (right of handle) -->
    <rect x="273" y="372" width="175" height="18" rx="9" fill="#ffffff" fill-opacity="0.35"/>
    <!-- active track (left of handle) -->
    <rect x="64" y="372" width="175" height="18" rx="9" fill="#ffffff"/>
    <!-- step tick marks (symmetric about center, clear of rounded ends + handle) -->
    <g fill="#6d28d9">
      <circle cx="76" cy="381" r="3.5"/>
      <circle cx="106" cy="381" r="3.5"/>
      <circle cx="136" cy="381" r="3.5"/>
      <circle cx="166" cy="381" r="3.5"/>
      <circle cx="196" cy="381" r="3.5"/>
      <circle cx="226" cy="381" r="3.5"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.9">
      <circle cx="286" cy="381" r="3.5"/>
      <circle cx="316" cy="381" r="3.5"/>
      <circle cx="346" cy="381" r="3.5"/>
      <circle cx="376" cy="381" r="3.5"/>
      <circle cx="406" cy="381" r="3.5"/>
      <circle cx="436" cy="381" r="3.5"/>
    </g>
    <!-- handle: vertical pill, taller than the track, with a gap on each side -->
    <rect x="248" y="353" width="16" height="56" rx="8" fill="#ffffff"/>
  </g>
</svg>
